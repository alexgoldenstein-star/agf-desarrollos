:root{

html{scroll-behavior:smooth;overflow-x:hidden;}

.nav-right{display:flex;align-items:center;gap:1rem;}

.nav-cta{padding:9px 24px;background:var(--red);color:var(--white);text-decoration:none;font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);transition:background .2s;}

.proj-hero-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(8,8,8,.96) 0%,rgba(8,8,8,.2) 60%,transparent 100%);}
.proj-hero-content{position:relative;z-index:2;max-width:1200px;margin:0 auto;width:100%;}

.not-found{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:3rem;}
.not-found h1{font-family:'Rajdhani',sans-serif;font-size:4rem;font-weight:700;color:var(--white);margin-bottom:.5rem;}
.not-found p{font-size:.9rem;color:var(--gray4);margin-bottom:2rem;line-height:1.7;}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease;}

@media(max-width:1280px){
  .proj-grid{grid-template-columns:1fr 300px;gap:2rem;}
}
@media(max-width:960px){
  nav{padding:0 1.5rem;}

@media(max-width:500px){

  .related-grid{grid-template-columns:1fr;}

  .proj-wrap{padding:1.5rem 1rem;}
}
</style>

function slug(nombre){
  return nombre.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s-]/g,'').trim().replace(/\s+/g,'-');
}

let all = [];

    const snap = await getDocs(collection(db,"proyectos"));

  const q = new URLSearchParams(window.location.search).get('id')||'';

}

    "@type":"RealEstateListing",
    "name":p.nombre,
    "description":p.desc,
    "address":{"@type":"PostalAddress","addressLocality":p.barrio,"addressRegion":"CABA","addressCountry":"AR"},
    "numberOfRooms":p.unidades,
    "image":imgs[0]||'',
    "url":window.location.href
  };
  const schemaEl = document.createElement('script');
  schemaEl.type='application/ld+json';
  schemaEl.textContent=JSON.stringify(schema);
  document.head.appendChild(schemaEl);

  // Gallery HTML
  let galHtml = '';
  if(imgs.length>0){
    galHtml = `
      <div class="proj-section reveal" style="margin-left:calc(-3rem);margin-right:calc(-3rem);width:calc(100% + 6rem);">
        <div class="gallery-main">
          <div class="car-track" id="gTrack">
            ${imgs.map((s,i)=>`<div class="car-slide"><img src="${s}" alt="${p.nombre} ${i+1}" loading="${i===0?'eager':'lazy'}"/></div>`).join('')}
          </div>
          ${imgs.length>1?`
            <button class="car-btn car-prev" onclick="gMove(-1)">&#8249;</button>
            <button class="car-btn car-next" onclick="gMove(1)">&#8250;</button>
            <div class="car-dots" id="gDots">${imgs.map((_,i)=>`<button class="car-dot ${i===0?'active':''}" onclick="gGo(${i})"></button>`).join('')}</div>
            <span class="car-counter"><span id="gIdx">1</span>/${imgs.length}</span>
          `:''}
        </div>
        ${imgs.length>1?`<div class="thumbs" id="gThumbs" style="padding:0 3rem;">${imgs.map((s,i)=>`<div class="thumb-item ${i===0?'active':''}" onclick="gGo(${i})"><img src="${s}" alt="Vista ${i+1}" loading="lazy"/></div>`).join('')}</div>`:''}
      </div>`;
  }

  // Caracteristicas
  const caractHtml = caract.length ? `
    <div class="proj-section reveal">
      <span class="sec-tag">Características</span>
      <h2 class="sec-h">Del edificio</h2>
      <div class="red-line"></div>
      <div class="caract-list">${caract.map(c=>`<div class="caract-item"><span class="caract-txt">${c}</span></div>`).join('')}</div>
    </div>` : '';

  // Related
  const relHtml = related.length ? `
    <div class="related-wrap reveal">
      <span class="sec-tag">Más proyectos</span>
      <h2 class="sec-h">También te puede interesar</h2>
      <div class="related-grid">
        ${related.map(r=>{
          const ri=(r.imagenes&&r.imagenes.length)?r.imagenes:[r.img1].filter(Boolean);
          return `<a href="proyecto.html?id=${slug(r.nombre)}" class="rel-card">
            ${ri[0]?`<img src="${ri[0]}" alt="${r.nombre}" loading="lazy"/>`:``}
            <div class="rel-overlay">
              <span class="rel-badge ${r.estado==='Terminado'?'done':''}">${r.estado}</span>
              <p class="rel-name">${r.nombre}</p>
              <p class="rel-loc">${r.barrio} · ${r.pisos} pisos</p>
            </div>
          </a>`;
        }).join('')}
      </div>
    </div>` : '';

  document.getElementById('pageContent').innerHTML = `
    <div class="proj-hero">
      <div class="proj-hero-bg">${imgs[0]?`<img src="${imgs[0]}" alt="${p.nombre}" loading="eager"/>`:''}</div>
      <div class="proj-hero-overlay"></div>
      <div class="proj-hero-content">
        <div class="proj-badge ${done?'done':''}"><span class="dot"></span>${p.estado}</div>
        <h1 class="proj-title">${p.nombre}</h1>
        <p class="proj-sub">${p.barrio}, CABA · ${p.fecha}</p>
        <div class="proj-specs-row">
          <div class="spec-pill"><p class="spec-pill-val">${p.pisos}<em>P</em></p><p class="spec-pill-lbl">Pisos</p></div>
          <div class="spec-pill"><p class="spec-pill-val">${p.unidades}</p><p class="spec-pill-lbl">Unidades</p></div>
          <div class="spec-pill"><p class="spec-pill-val">${p.superficie||'—'}</p><p class="spec-pill-lbl">Superficie</p></div>
          <div class="spec-pill"><p class="spec-pill-val">${imgs.length}<em>+</em></p><p class="spec-pill-lbl">Fotos</p></div>
        </div>
      </div>
    </div>

    <div class="proj-wrap">
      <div class="proj-grid">
        <div>
          ${galHtml}
          <div class="proj-section reveal">
            <span class="sec-tag">Sobre el proyecto</span>
            <h2 class="sec-h">${p.nombre}</h2>
            <div class="red-line"></div>
            <p class="proj-desc-text">${p.desc}</p>
          </div>
          ${caractHtml}
          <div class="proj-section reveal">
            <span class="sec-tag">Ubicación</span>
            <h2 class="sec-h">Barrio ${p.barrio}</h2>
            <div class="red-line"></div>
            <div class="zona-grid">
              <div>
                <p class="zona-txt">${zona.desc}</p>
                <div class="zona-tags">${zona.tags.map(t=>`<span class="zona-tag">${t}</span>`).join('')}</div>
                <a href="https://maps.google.com/?q=${mapsQ}" target="_blank" style="font-size:.72rem;color:var(--red);text-decoration:none;display:inline-block;margin-top:.8rem">Ver en Google Maps ↗</a>
              </div>
              <div class="map-box">
                <iframe src="https://maps.google.com/maps?q=${mapsQ}&output=embed&hl=es&z=16" allowfullscreen loading="lazy" title="Mapa ${p.nombre}"></iframe>
              </div>
            </div>
          </div>
          ${relHtml}
        </div>

        <div class="proj-sidebar reveal">
          <div class="s-card">
            <p class="s-card-title">Ficha <em>técnica</em></p>
            <div class="s-specs">
              <div class="s-spec"><span class="s-spec-l">Estado</span><span class="s-spec-v">${p.estado}</span></div>
              <div class="s-spec"><span class="s-spec-l">Barrio</span><span class="s-spec-v">${p.barrio}</span></div>
              <div class="s-spec"><span class="s-spec-l">Pisos</span><span class="s-spec-v">${p.pisos}</span></div>
              <div class="s-spec"><span class="s-spec-l">Unidades</span><span class="s-spec-v">${p.unidades}</span></div>
              ${p.superficie?`<div class="s-spec"><span class="s-spec-l">Superficie</span><span class="s-spec-v">${p.superficie}</span></div>`:''}
              <div class="s-spec"><span class="s-spec-l">Entrega</span><span class="s-spec-v">${p.fecha}</span></div>
            </div>
          </div>

          <div class="s-card">
            <p class="s-card-title">Consultá <em>disponibilidad</em></p>
            <div class="cta-form">
              <input class="fi" id="fNom" placeholder="Tu nombre" type="text"/>
              <input class="fi" id="fTel" placeholder="Tu teléfono" type="tel"/>
              <input class="fi" id="fMail" placeholder="Tu email" type="email"/>
              <select class="fi" id="fInt" style="clip-path:polygon(7px 0%,100% 0%,calc(100% - 7px) 100%,0% 100%)">
                <option value="">Me interesa...</option>
                <option>Comprar un departamento</option>
                <option>Invertir en el proyecto</option>
                <option>Más información</option>
              </select>
              <button class="btn-red" onclick="sendForm('${p.nombre}','${p.barrio}')">Enviar consulta</button>
              <a class="btn-wa" href="https://wa.me/5491150614489?text=${waMsg}" target="_blank">
                <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347zM12 0C5.373 0 0 5.373 0 12c0 2.117.549 4.107 1.51 5.838L0 24l6.335-1.652A11.954 11.954 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg>
                WhatsApp directo
              </a>
              <p class="fstatus" id="fStatus"></p>
            </div>
          </div>

          <div class="s-card">
            <p class="s-card-title">Compartir <em>proyecto</em></p>
            <div class="share-row">
              <a class="share-btn" href="https://wa.me/?text=${encodeURIComponent(p.nombre+' — AGF Desarrollos ')}${pageUrl}" target="_blank">WA</a>
              <a class="share-btn" href="https://www.facebook.com/sharer/sharer.php?u=${pageUrl}" target="_blank">FB</a>
              <button class="share-btn" onclick="copyLink(this)">Copiar link</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;

  document.getElementById('pageContent').style.display='block';
  document.getElementById('pageLoader').style.display='none';

  // Carousel state
  window._g = {idx:0, total:imgs.length};

  // Reveal
  setTimeout(()=>{
    const obs=new IntersectionObserver(es=>{
      es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');obs.unobserve(e.target);}});
    },{threshold:.08});
    document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
  },120);
}

// Carousel
window.gMove=function(d){ const c=window._g; if(!c||c.total<=1)return; c.idx=(c.idx+d+c.total)%c.total; applyG(); };
window.gGo=function(i){ if(window._g){ window._g.idx=i; applyG(); } };
function applyG(){
  const i=window._g.idx;
  const t=document.getElementById('gTrack'); if(t) t.style.transform=`translateX(-${i*100}%)`;
  document.querySelectorAll('#gDots .car-dot').forEach((d,j)=>d.classList.toggle('active',j===i));
  document.querySelectorAll('#gThumbs .thumb-item').forEach((d,j)=>d.classList.toggle('active',j===i));
  const el=document.getElementById('gIdx'); if(el) el.textContent=i+1;
}

// Form
window.sendForm=async function(pNombre,pBarrio){
  const n=document.getElementById('fNom').value.trim();
  const t=document.getElementById('fTel').value.trim();
  const e=document.getElementById('fMail').value.trim();
  const i=document.getElementById('fInt').value;
  const st=document.getElementById('fStatus');
  if(!n||!e){st.textContent='Completá nombre y email.';st.className='fstatus';return;}
  const btn=document.querySelector('.btn-red'); btn.textContent='Enviando...';btn.disabled=true;
  try{
    await addDoc(collection(db,"contactos"),{nombre:n,telefono:t,email:e,interes:i,mensaje:`Consulta desde página del proyecto: ${pNombre} (${pBarrio})`,proyecto:pNombre,estado:'nuevo',fecha:serverTimestamp()});
    st.textContent='✓ Consulta enviada. Te contactamos pronto.';st.className='fstatus ok';
    ['fNom','fTel','fMail'].forEach(id=>document.getElementById(id).value='');
  }catch(ex){
    window.open(`https://wa.me/5491150614489?text=${encodeURIComponent('Hola, me interesa '+pNombre)}`, '_blank');
  }
  btn.textContent='Enviar consulta';btn.disabled=false;
};

// Copy
window.copyLink=function(btn){
  navigator.clipboard.writeText(window.location.href).then(()=>{
    btn.textContent='¡Copiado!';setTimeout(()=>btn.textContent='Copiar link',2000);
  });
};

function showNF(msg){
  document.getElementById('pageLoader').style.display='none';
  document.getElementById('pageContent').style.display='block';
  document.getElementById('pageContent').innerHTML=`<div class="not-found"><h1>404</h1><p>${msg}</p><a href="index.html#proyectos" style="padding:12px 28px;background:var(--red);color:white;text-decoration:none;font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);display:inline-block">← Ver proyectos</a></div>`;
}

init();
</script>
<script>
const cur=document.getElementById('cursor'),ring=document.getElementById('cursor-ring');
document.addEventListener('mousemove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';ring.style.left=e.clientX+'px';ring.style.top=e.clientY+'px';});
document.addEventListener('mouseover',e=>{
  if(e.target.closest('a,button,.car-dot,.thumb-item,.zona-tag,.rel-card')){cur.style.width='14px';cur.style.height='14px';ring.style.width='46px';ring.style.height='46px';}
  else{cur.style.width='8px';cur.style.height='8px';ring.style.width='32px';ring.style.height='32px';}
});
</script>
</body>
</html>
